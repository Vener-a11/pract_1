<!DOCTYPE html>
<html>
<head>
    <title>Добавление книги</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Добавление книги</h2>
    <form method="POST">
        <input type="text" name="title" placeholder="Название книги" required><br><br>
        <input type="text" name="author" placeholder="Автор" required><br><br>
        <input type="number" name="year" placeholder="Год издания"><br><br>
        <input type="text" name="genre" placeholder="Жанр"><br><br>
        <input type="number" name="copies" placeholder="Кол-во экземпляров" required><br><br>
        <button type="submit">Добавить</button>
        <a href="{{ url_for('index') }}">Отменить</a>
    </form>
</body>
</html>
